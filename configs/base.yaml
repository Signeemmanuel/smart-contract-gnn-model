# Base experiment config. One file per experiment; log it with every run.
seed: 42
device: cuda          # falls back to cpu automatically if unavailable
threshold: 0.70       # Snorkel positive threshold AND inference flag threshold
conv: sage            # gcn | sage | gat
hid: 128
layers: 3
heads: 4              # used only by gat
dropout: 0.5
n_classes: 5
lr: 0.001
weight_decay: 0.00001
batch_size: 32
epochs: 200
patience: 15
