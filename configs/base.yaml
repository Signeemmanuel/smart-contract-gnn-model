# Base experiment config. One file per experiment; log it with every run.
# Defaults reflect the settled final recipe used for the reported results.
seed: 42
device: cuda          # falls back to cpu automatically if unavailable
threshold: 0.5        # fallback only; v2 tunes per-class thresholds on VALIDATION
conv: sage            # gcn | sage | gat (retired) | gatv2
hid: 128
layers: 3
heads: 4              # used only by the attention encoders (gat, gatv2)
dropout: 0.5
n_classes: 5
lr: 0.001
weight_decay: 0.00001
batch_size: 256       # final recipe (was 32 in early smoke runs)
epochs: 600           # max; early stopping ends well before this
patience: 50          # epochs without val-macro-F1 improvement before stopping
